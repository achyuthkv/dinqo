<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinqo WhatsApp Simulator</title>
<style>
  :root { --bg:#efeae2; --me:#d9fdd3; --them:#fff; --ink:#111b21; --muted:#667781; --accent:#008069; --line:#e9edef; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:#d1d7db; }
  .wrap { max-width: 480px; height: 100dvh; margin: 0 auto; display:flex; flex-direction:column; background:var(--bg); }
  header { background:var(--accent); color:#fff; padding:10px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header b { flex: 1 0 100%; font-size: 16px; }
  header input, header select { padding:6px 8px; border-radius:6px; border:0; font:inherit; min-width:0; }
  header input.phone { flex: 1 1 140px; } header input.name { flex: 1 1 100px; }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width: 85%; padding:6px 9px 4px; border-radius:8px; box-shadow:0 1px .5px rgba(0,0,0,.13); white-space:pre-wrap; word-wrap:break-word; }
  .in { align-self:flex-end; background:var(--me); }
  .out { align-self:flex-start; background:var(--them); }
  .meta { font-size:11px; color:var(--muted); text-align:right; margin-top:2px; }
  .tag { font-size:11px; color:var(--accent); font-weight:600; margin-bottom:2px; }
  .footer { font-size:12px; color:var(--muted); margin-top:4px; }
  .btns { display:flex; flex-direction:column; gap:1px; margin:6px -9px -4px; border-top:1px solid var(--line); }
  .btns button, .btns a { background:none; border:0; border-top:1px solid var(--line); padding:9px; color:#027eb5; font:inherit; cursor:pointer; text-align:center; text-decoration:none; }
  .btns button:first-child, .btns a:first-child { border-top:0; }
  .btns button:hover, .btns a:hover { background:#f5f6f6; }
  .rows { display:none; margin-top:6px; border-top:1px solid var(--line); }
  .rows.open { display:block; }
  .rows button { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:8px 4px; font:inherit; cursor:pointer; }
  .rows button small { display:block; color:var(--muted); font-size:12px; }
  form.compose { display:flex; gap:8px; padding:8px; background:#f0f2f5; }
  form.compose input { flex:1; padding:10px 12px; border-radius:20px; border:0; font:inherit; min-width:0; }
  form.compose button { border:0; background:var(--accent); color:#fff; border-radius:20px; padding:0 16px; font:inherit; cursor:pointer; }
  .hint { text-align:center; color:var(--muted); font-size:13px; margin: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>Dinqo · WhatsApp simulator</b>
    <input class="phone" id="phone" placeholder="Phone e.g. 9845000001" inputmode="tel">
    <input class="name" id="name" placeholder="Profile name">
    <select id="known" aria-label="Known players"><option value="">Players…</option></select>
  </header>
  <div id="chat"><p class="hint">Enter a phone number and say "hi" to register, or pick a seeded player.</p></div>
  <form class="compose" id="compose">
    <input id="text" placeholder="Type a message" autocomplete="off">
    <button>Send</button>
  </form>
</div>
<script>
const $ = (s) => document.querySelector(s);
let templates = {};
let lastSig = '';
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
$('#phone').value = store.get('sim.phone');
$('#name').value = store.get('sim.name');

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmt(s) { return esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>'); }

async function send(body) {
  const phone = $('#phone').value.trim();
  if (!phone) { alert('Enter a phone number first'); return; }
  store.set('sim.phone', phone); store.set('sim.name', $('#name').value.trim());
  await fetch('/dev/inbound', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: phone, name: $('#name').value.trim() || undefined, ...body }) });
  refresh();
}

function renderTemplate(m) {
  const t = templates[m.template.name];
  let text = t ? t.body.replace(/\{\{(\d+)\}\}/g, (_, i) => m.template.params[i - 1] ?? '') : m.template.name;
  const btns = (t?.buttons ?? []).map((label, i) => {
    const payload = m.template.buttonPayloads?.[i];
    return payload ? `<button data-payload="${esc(payload)}">${esc(label)}</button>` : '';
  }).join('');
  return `<div class="tag">Template · ${esc(m.template.name)}</div>${fmt(text)}${btns ? `<div class="btns">${btns}</div>` : ''}`;
}

function renderSession(s) {
  const footer = s.footer ? `<div class="footer">${esc(s.footer)}</div>` : '';
  if (s.kind === 'text') return fmt(s.text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  if (s.kind === 'buttons') return `${fmt(s.text)}${footer}<div class="btns">${s.buttons.map((b) => `<button data-payload="${esc(b.id)}">${esc(b.title)}</button>`).join('')}</div>`;
  if (s.kind === 'cta_url') return `${fmt(s.text)}${footer}<div class="btns"><a href="${esc(s.url)}" target="_blank">🔗 ${esc(s.label)}</a></div>`;
  if (s.kind === 'list') {
    const rows = s.rows.map((r) => `<button data-payload="${esc(r.id)}">${esc(r.title)}${r.description ? `<small>${esc(r.description)}</small>` : ''}</button>`).join('');
    return `${fmt(s.text)}${footer}<div class="btns"><button data-toggle>☰ ${esc(s.buttonLabel)}</button></div><div class="rows">${rows}</div>`;
  }
  return esc(JSON.stringify(s));
}

async function refresh() {
  const phone = $('#phone').value.trim();
  if (!phone) return;
  const msgs = await (await fetch('/dev/conversation?phone=' + encodeURIComponent(phone))).json();
  const sig = JSON.stringify(msgs.map((m) => [m.id, m.status]));
  if (sig === lastSig) return;
  lastSig = sig;
  const chat = $('#chat');
  chat.innerHTML = msgs.length ? '' : '<p class="hint">No messages yet — say "hi".</p>';
  for (const m of msgs) {
    const div = document.createElement('div');
    div.className = 'msg ' + m.direction;
    let html;
    if (m.direction === 'in') html = esc(m.body.text || m.body.payload);
    else {
      // Show what the player would actually receive: templates are used when the 24h window was closed.
      html = m.kind === 'template' && m.body.template ? renderTemplate(m.body) : renderSession(m.body.session);
    }
    const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `${html}<div class="meta">${time}${m.direction === 'out' ? ' · ' + esc(m.status) : ''}</div>`;
    chat.appendChild(div);
  }
  chat.scrollTop = chat.scrollHeight;
}

$('#chat').addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.hasAttribute('data-toggle')) { t.closest('.msg').querySelector('.rows').classList.toggle('open'); return; }
  const label = t.childNodes[0]?.textContent ?? t.textContent;
  if (t.dataset.payload) send({ payload: t.dataset.payload, text: label });
});
$('#compose').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('#text').value.trim();
  if (!text) return;
  $('#text').value = '';
  send({ text });
});
$('#phone').addEventListener('change', () => { lastSig = ''; store.set('sim.phone', $('#phone').value.trim()); refresh(); });
$('#known').addEventListener('change', (e) => {
  const [phone, name] = e.target.value.split('|');
  if (!phone) return;
  $('#phone').value = phone; $('#name').value = name || ''; lastSig = ''; refresh();
});

(async () => {
  templates = await (await fetch('/dev/templates')).json();
  const players = await (await fetch('/dev/players')).json();
  for (const p of players) {
    const o = document.createElement('option');
    o.value = `${p.phone}|${p.name ?? ''}`; o.textContent = `${p.name ?? '—'} (${p.phone})`;
    $('#known').appendChild(o);
  }
  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
